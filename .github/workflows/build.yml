name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build and lint
        run: ./gradlew assembleRelease lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: haven-release-apk
          path: app/build/outputs/apk/release/*.apk
